name: MetaBookReader
options:
  deploymentTarget:
    iOS: '17.2'
packages:
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.0
settings:
  base:
    SWIFT_VERSION: '6.3'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ''
    META_APP_ID: '0'
    CLIENT_TOKEN: ''
targets:
  MetaBookReader:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.metabookreader
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
